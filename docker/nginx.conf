worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 8080;
        root /var/www/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Robots-Tag "index, follow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- Redirects 301: URLs viejas de WordPress/WooCommerce sin equivalente en el sitio nuevo ---
        location = /חנות/ { return 301 /; }
        location = /חנות { return 301 /; }
        location = /חנות/checkout/ { return 301 /; }
        location = /חנות/checkout { return 301 /; }
        location = /חנות/עגלה/ { return 301 /; }
        location = /חנות/עגלה { return 301 /; }
        location = /פרטי-הזמנה/ { return 301 /; }
        location = /פרטי-הזמנה { return 301 /; }
        location = /החשבון-שלי/ { return 301 /; }
        location = /החשבון-שלי { return 301 /; }
        location = /category/general/ { return 301 /מאמרים/; }
        location = /category/general { return 301 /מאמרים/; }
        location = /author/y0548431060gmail-com/ { return 301 /מאמרים/; }
        location = /author/y0548431060gmail-com { return 301 /מאמרים/; }
        location = /author/admin/ { return 301 /מאמרים/; }
        location = /author/admin { return 301 /מאמרים/; }
        location = /צרו-קשר/מפת-אתר/ { return 301 /מאמרים/; }
        location = /צרו-קשר/מפת-אתר { return 301 /מאמרים/; }

        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ /(private|\.git|site-mirror|data) {
            deny all;
            return 404;
        }
    }
}
